<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">Приклад процесу CI та CD у команді</title>
<desc id="desc">Навчальна схема: staging і production deploy у нас ще не налаштовані.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1100" height="900" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif">
<text x="50" y="55" font-size="28" font-weight="bold" fill="#14334e">Приклад процесу CI та CD у команді</text>
<text x="50" y="87" font-size="17" fill="#475569">Навчальна схема: staging і production deploy у нас ще не налаштовані.</text>
<path d="M490,195 L610,195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M830,260 L830,330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M610,395 L490,395" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270,460 L270,530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M490,595 L610,595" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="130" width="440" height="130" rx="14" fill="white" stroke="#2675bc" stroke-width="2"/>
<rect x="50" y="144" width="5" height="102" fill="#2675bc"/>
<text x="72" y="164" font-size="21" font-weight="bold" fill="#14334e">1  Pull request</text>
<text x="72" y="193" font-size="17" fill="#334155">Зміна форми реєстрації</text>
<text x="72" y="218" font-size="17" fill="#334155">Review і короткі перевірки</text>
<rect x="610" y="130" width="440" height="130" rx="14" fill="white" stroke="#13867d" stroke-width="2"/>
<rect x="610" y="144" width="5" height="102" fill="#13867d"/>
<text x="632" y="164" font-size="21" font-weight="bold" fill="#14334e">2  CI checks</text>
<text x="632" y="193" font-size="17" fill="#334155">Перевірки коду та тести</text>
<text x="632" y="218" font-size="17" fill="#334155">Помилка → виправити → повторити</text>
<rect x="610" y="330" width="440" height="130" rx="14" fill="white" stroke="#2675bc" stroke-width="2"/>
<rect x="610" y="344" width="5" height="102" fill="#2675bc"/>
<text x="632" y="364" font-size="21" font-weight="bold" fill="#14334e">3  Merge у main</text>
<text x="632" y="393" font-size="17" fill="#334155">Після review та потрібних checks</text>
<text x="632" y="418" font-size="17" fill="#334155">Правила merge налаштовують окремо</text>
<rect x="50" y="330" width="440" height="130" rx="14" fill="white" stroke="#b7791f" stroke-width="2"/>
<rect x="50" y="344" width="5" height="102" fill="#b7791f"/>
<text x="72" y="364" font-size="21" font-weight="bold" fill="#14334e">4  Build і staging</text>
<text x="72" y="393" font-size="17" fill="#334155">Збірка та розгортання тестової версії</text>
<text x="72" y="418" font-size="17" fill="#334155">Smoke на розгорнутому застосунку</text>
<rect x="50" y="530" width="440" height="130" rx="14" fill="white" stroke="#b7791f" stroke-width="2"/>
<rect x="50" y="544" width="5" height="102" fill="#b7791f"/>
<text x="72" y="564" font-size="21" font-weight="bold" fill="#14334e">5  Погодження випуску</text>
<text x="72" y="593" font-size="17" fill="#334155">Можлива вимога environment</text>
<text x="72" y="618" font-size="17" fill="#334155">Погоджує відповідальна людина</text>
<rect x="610" y="530" width="440" height="130" rx="14" fill="white" stroke="#13867d" stroke-width="2"/>
<rect x="610" y="544" width="5" height="102" fill="#13867d"/>
<text x="632" y="564" font-size="21" font-weight="bold" fill="#14334e">6  Production deploy</text>
<text x="632" y="593" font-size="17" fill="#334155">Оновлення версії для користувачів</text>
<text x="632" y="618" font-size="17" fill="#334155">Перевірка стану після випуску</text>
<rect x="50" y="730" width="1000" height="100" rx="14" fill="white" stroke="#2675bc" stroke-width="2"/>
<rect x="50" y="744" width="5" height="72" fill="#2675bc"/>
<text x="72" y="764" font-size="21" font-weight="bold" fill="#14334e">Окремий workflow за розкладом</text>
<text x="72" y="793" font-size="17" fill="#334155">Нічна регресія на staging: ширший набір сценаріїв і браузерів.</text>
<text x="50" y="872" font-size="16" fill="#475569">Зелений CI підтверджує тільки виконані перевірки; рішення про випуск має власні умови.</text>
</g></svg>